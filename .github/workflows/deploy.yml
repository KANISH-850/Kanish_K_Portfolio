name: Deploy Next.js Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup GitHub Pages Configuration
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Verify Code Quality & Lint
        run: npm run lint

      - name: Build Next.js Static Export
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '/Kanish_K_Portfolio' }}
        run: npm run build

      - name: Verify Static Export Directory
        run: |
          if [ ! -d "out" ]; then
            echo "Error: Output directory 'out' does not exist after build."
            exit 1
          fi
          if [ ! -f "out/index.html" ]; then
            echo "Error: 'out/index.html' not found."
            exit 1
          fi
          echo "Static export verified successfully."

      - name: Add .nojekyll Flag
        run: touch out/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
