name: Deploy Next.js Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup GitHub Pages Configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Verify Code Quality & Lint
        run: npm run lint

      - name: Build Next.js Static Export
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '/Kanish_K_Portfolio' }}
        run: npm run build

      - name: Verify Static Export Directory
        run: |
          for file in "out/index.html" "out/404.html" "out/robots.txt" "out/sitemap.xml" "out/og-image.png" "out/projects/digital-twin-ehv/index.html" "out/projects/digital-twin-ehv-substation/index.html" "out/projects/intelligent-grievance-system/index.html" "out/projects/aquaguard-ai/index.html" "out/projects/kiosk-management-system/index.html" "out/notes/index.html" "out/recruiter/index.html" "out/judge/index.html"; do
            if [ ! -f "$file" ]; then
              echo "Error: Required static export file '$file' not found."
              exit 1
            fi
          done
          if [ ! -d "out/_next/static" ]; then
            echo "Error: 'out/_next/static' directory not found."
            exit 1
          fi
          echo "Static export verified successfully."

      - name: Add .nojekyll Flag
        run: touch out/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
